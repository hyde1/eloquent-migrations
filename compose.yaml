# Databases used by the integration tests, see "Tests" in README.md
#   docker compose up -d --wait
#   DB_CONNECTION=pgsql composer test
#   DB_CONNECTION=mysql composer test
services:
  pgsql:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: elmigrator
      POSTGRES_USER: elmigrator
      POSTGRES_PASSWORD: elmigrator
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U elmigrator -d elmigrator"]
      interval: 2s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: elmigrator
      MYSQL_ROOT_PASSWORD: elmigrator
    ports:
      - "33069:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pelmigrator"]
      interval: 2s
      timeout: 5s
      retries: 30
